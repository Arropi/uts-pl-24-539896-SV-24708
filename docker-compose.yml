services:
  db:
    image: mysql:8.0.40
    container_name: coral_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-uts_kepl}
      MYSQL_USER: ${DB_USERNAME:-kepl_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rahasia_db_123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_rahasia_123}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coral_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-uts_kepl}
      DB_USERNAME: ${DB_USERNAME:-kepl_user}
      DB_PASSWORD: ${DB_PASSWORD:-rahasia_db_123}
    volumes:
      - ./backend/storage:/app/storage
    command: >
      sh -c "php artisan migrate --force &&
             frankenphp php-server --listen :8000 --root public/"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000 || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coral_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - app-network

volumes:
  db_data:
    driver: local

networks:
  app-network:
    driver: bridge
